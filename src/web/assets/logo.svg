<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cortexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Shard -->
  <polygon points="50,6 90,28 90,72 50,94 10,72 10,28" 
           stroke="url(#cortexGrad)" stroke-width="3" fill="rgba(79, 70, 229, 0.05)" />

  <!-- Inner Neural Cortex Nodes & Synapses -->
  <path d="M50,22 L50,42 M50,42 L30,54 M50,42 L70,54 M30,54 L30,76 M70,54 L70,76 M30,54 L50,66 M70,54 L50,66 M50,66 L50,86" 
        stroke="url(#cortexGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Glowing Neural Synapse Points -->
  <circle cx="50" cy="22" r="4.5" fill="#4F46E5" filter="url(#glow)" />
  <circle cx="50" cy="42" r="5" fill="#7C3AED" filter="url(#glow)" />
  <circle cx="30" cy="54" r="4" fill="#0284C7" />
  <circle cx="70" cy="54" r="4" fill="#0284C7" />
  <circle cx="50" cy="66" r="4.5" fill="#7C3AED" filter="url(#glow)" />
  <circle cx="30" cy="76" r="3.5" fill="#4F46E5" />
  <circle cx="70" cy="76" r="3.5" fill="#4F46E5" />
  <circle cx="50" cy="86" r="4" fill="#10B981" />
</svg>
