<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="mobiusGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="mobiusGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="55%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="coreLaser" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Sculptural Body of Infinity Loop -->
  <path d="M30 35 C18 35, 10 43, 10 52 C10 61, 18 69, 30 69 C42 69, 58 52, 70 52 C82 52, 90 44, 90 35 C90 26, 82 18, 70 18 C58 18, 42 35, 30 35 Z" 
        fill="#090D18" stroke="url(#mobiusGrad1)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />

  <path d="M70 65 C82 65, 90 57, 90 48 C90 39, 82 31, 70 31 C58 31, 42 48, 30 48 C18 48, 10 56, 10 65 C10 74, 18 82, 70 82 C82 82, 90 74, 70 65 Z" 
        fill="#0F172A" fill-opacity="0.7" stroke="url(#mobiusGrad2)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Inner High-Intensity Neon Laser Core Line -->
  <path d="M30 38 C20 38, 14 44, 14 52 C14 60, 20 66, 30 66 C42 66, 58 34, 70 34 C80 34, 86 40, 86 48 C86 56, 80 62, 70 62 C58 62, 42 38, 30 38 Z" 
        stroke="url(#coreLaser)" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Synaptic Quantum Energy Nodes -->
  <circle cx="50" cy="50" r="3" fill="#FFFFFF" filter="url(#neonGlow)" />
  <circle cx="20" cy="52" r="2.2" fill="#38BDF8" filter="url(#neonGlow)" />
  <circle cx="80" cy="48" r="2.2" fill="#A855F7" filter="url(#neonGlow)" />
</svg>
